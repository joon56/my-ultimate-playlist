[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "walkmusic"
version = "0.1.0"
description = "Sensor Logger 기록에서 케이던스·동조율·역학 지표를 계산하는 분석 코드 (walk-music)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tomli; python_version < '3.11'",  # DECISIONS D-52
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["data", "results", "results_synthetic", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
